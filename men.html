<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Men's Fashion | MasakaFashion Hub</title>
  <style>
    :root { --ink:#211a18; --paper:#fffaf2; --green:#176b45; --line:#eadfd1; }
    * { box-sizing:border-box; }
    body { margin:0; font-family: Arial, sans-serif; background: var(--paper); color: var(--ink); }
    a { text-decoration:none; color: inherit; }
    .topbar { background: var(--green); color:white; text-align:center; padding:10px 0; font-size:14px; }
    .container { max-width:1120px; margin:0 auto; padding:0 20px; }
    header { background: white; border-bottom:1px solid var(--line); }
    nav { display:flex; justify-content:space-between; align-items:center; gap:20px; padding:18px 0; }
    .brand { font-weight:700; font-size: clamp(1.2rem, 3vw, 1.8rem); }
    .brand span { color: var(--green); }
    .nav-links { display:flex; gap:18px; flex-wrap:wrap; }
    .nav-links a { font-weight:600; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:20px; margin: 30px 0 40px; }
    .card { background:white; border:1px solid var(--line); border-radius:16px; overflow:hidden; }
    .card img { display:block; width:100%; height:240px; object-fit:cover; }
    .card-body { padding:14px 16px 18px; }
    .card-body strong { display:block; margin-bottom:5px; }
    h1 { margin-top:30px; }
  </style>
</head>
<body>
  <div class="topbar">Fresh styles, African-inspired flair · Based in Masaka, Uganda</div>
  <header>
    <div class="container">
      <nav>
        <a class="brand" href="index.html">MasakaFashion <span>Hub</span></a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="shop.html">Shop</a>
          <a href="women.html">Women</a>
          <a href="men.html">Men</a>
          <a href="shoes-accessories.html">Shoes & Accessories</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Men's Fashion</h1>
    <div class="grid">
      <div class="card"><a href="shop.html"><img src="kitenge-shirt.jpg" alt="Kitenge shirt" /><div class="card-body"><strong>Kitenge Statement Shirt</strong><span>UGX 65,000</span></div></a></div>
      <div class="card"><a href="shop.html"><img src="chinos.jpg" alt="Chinos" /><div class="card-body"><strong>Smart Casual Chinos</strong><span>UGX 70,000</span></div></a></div>
      <div class="card"><a href="shop.html"><img src="oxford-shirt.jpg" alt="Oxford shirt" /><div class="card-body"><strong>Oxford Long-sleeve Shirt</strong><span>UGX 60,000</span></div></a></div>
      <div class="card"><a href="shop.html"><img src="loafers.jpg" alt="Loafers" /><div class="card-body"><strong>Classic Loafers</strong><span>UGX 110,000</span></div></a></div>
    </div>
  </main>
</body>
</html>
